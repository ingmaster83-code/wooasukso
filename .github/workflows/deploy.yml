name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '45 20 * * *'   # 매일 KST 05:45 — TourAPI 숙박 목록·상세 수집 (여행코스 05:00·우아메뉴 05:30 뒤, 일일 한도 공유)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch lodgings (상세는 data/details 에 누적, 숙소당 1호출, 하루 예산 1000호출)
        if: github.event_name != 'push'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DAILY_BUDGET: '1000'
        run: python scripts/fetch_data.py
        continue-on-error: true
      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update lodging data" && git push)
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
